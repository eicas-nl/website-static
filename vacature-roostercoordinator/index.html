<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EICAS - 404 - Pagina niet gevonden</title>
    <style>
        @font-face {
            font-family: Archivo;
            font-style: normal;
            font-weight: 900;
            src: url("/fonts/Archivo-Black.woff2") format("woff2"),url("/fonts/Archivo-Black.woff") format("woff");
        }

        @font-face {
            font-family: "Roboto";
            font-style: normal;
            font-weight: 300;
            src: url("/fonts/roboto-light.woff2") format("woff2"),url("/fonts/roboto-light.woff") format("woff");
        }         

        /* Base reset */
        html, body {
            margin: 0;
            padding: 0;
            font-family: Roboto, sans-serif;
            line-height: 1.4;
            background: #fff;
            color: #000;
            box-sizing: border-box;
        }

        *, *::before, *::after {
            box-sizing: inherit;
        }

        /* Fixed header with responsive logo */
        header#main-logo {
            position: fixed;
            top: 0;
            left: 0;
            width: 22vw;
            padding: 2vw 3vw 2vw 4vw;
            z-index: 5;
            background: transparent;
        }

        header#main-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Content area — automatically pushed below header */
        #no-gallery-story {
            padding: 0 12vw 0 4vw;
            overflow-y: auto;
            margin-top: calc(2vw + 14vw + 2vw);
        }

        /* Typography */
        a {
            cursor: pointer;
            text-decoration: underline;
            color: #000;
        }

        article h1 {
            font-family: Archivo, sans-serif;
            font-size: 165%;
            font-weight: 900;
            margin: 0 0 0.6em;
        }

        article p {
            font-size: 115%;
            font-weight: 300;
            margin: 0 0 1em;
        }

        article section {
            margin: 0.8rem 0;
        }


        /* Mobile */
        @media (max-width: 768px) {
            header#main-logo {
                width: 40vw;
                padding: 4vw 4vw 3vw 4vw;
            }

            #no-gallery-story {
                padding: 0 6vw;
                margin-top: calc(4vw + 30vw + 3vw);
            }

            article h1 {
                font-family: Archivo, sans-serif;
                font-size: 160%;
            }

            article p {
                font-size: 115%;
            }
        }

        @media (max-width: 480px) {
            header#main-logo {
                width: 55vw;
                padding: 5vw 5vw 4vw 5vw;
            }

            #no-gallery-story {
                padding: 0 5vw;
                margin-top: calc(5vw + 40vw + 4vw);
            }

            article h1 {
                font-family: Archivo, sans-serif;
                font-size: 140%;
            }
        }
    </style>

</head>

<body class="error-page">

<header id="main-logo">
    <a href="/">
        <img src="/img/logo-eicas.png" alt="logo EICAS">
    </a>
</header>

<div id="no-gallery-story">
    <main>
        <article>
            <header>
                <h1>Pagina niet gevonden (404)</h1>
            </header>

            <section>
                <p>De pagina die je zoekt is helaas niet gevonden!</p> <p>Ga na of de URL klopt. Ook kun je terug gaan naar 
<a href="https://www.eicas.nl">de startpagina</a> of <a href="https://www.eicas.nl/zoeken">de zoekfunctie proberen</a>
 om zo de juiste pagina te vinden.</p>
            </section>
        </article>
    </main>
</div>

</body>
</html>
